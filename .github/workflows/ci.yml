name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bunx vitest run --coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              const rows = ['lines','statements','functions','branches']
                .map(k => \`| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |\`).join('\n');
              const md = ['## Couverture de tests','','| Métrique | % | Couvert |','|---|---|---|',rows,''].join('\n');
              console.log(md);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');
            "
          else
            echo "Aucun rapport de couverture trouvé." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report (lcov + html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
